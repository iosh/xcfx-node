[workspace]
members = ["crates/xcfx-node", "crates/xcfx-node-napi"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/iosh/xcfx-node"


[workspace.dependencies]
alloy-provider = { version = "2.4.1", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-rpc-client = { version = "2.4.1", default-features = false, features = ["reqwest"] }
alloy-rpc-types-eth = { version = "2.4.1", default-features = false }
alloy-transport = { version = "2.4.1", default-features = false }
coins-bip32 = { version = "0.12", default-features = false }
coins-bip39 = { version = "0.12", default-features = false, features = ["english"] }
cfx-addr = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfxkey = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-executor = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-internal-common = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-mpt = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-parameters = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-rpc-cfx-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-rpc-eth-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-statedb = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-storage-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
cfx-vm-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
primitives = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
diem-crypto = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
diem-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }
pow-types = { git = "https://github.com/iosh/conflux-rust", branch = "v3.1.0" }

rustc-hex = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imbl = "7.0.1"
tokio = { version = "1.53.1", features = ["rt", "net", "sync", "time", "macros"] }
thiserror = "2"
rlp = "0.6"
keccak-hash = "0.12"
